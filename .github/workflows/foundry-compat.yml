name: Foundry compatibility

# Checks the Foundry VTT export against the latest Foundry RuneQuest system and compendium releases.
# Runs weekly, whenever the Foundry export code changes, and on demand. Opens an issue if something breaks.

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/data/foundryMap.ts'
      - 'src/engine/foundry.ts'
      - 'scripts/check-foundry.ts'
      - 'scripts/foundry-known-missing.json'
      - '.github/workflows/foundry-compat.yml'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check against the latest Foundry RQG release
        run: node scripts/check-foundry.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open an issue if the check failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Foundry VTT export may be broken by a Foundry RQG update'
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' })
            if (open.some(i => i.title === title)) return
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: `The weekly Foundry compatibility check failed. See the run summary for what changed:\n\n${run}`,
            })
